<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Subject</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Edit Subject</h2>

    <form th:action="@{/subjects/update/{id}(id=${subject.subjectId})}"
          th:object="${subject}"
          method="post">

        <label>Subject Code</label>

        <input type="text"
               th:field="*{subjectCode}"
               required>

        <label>Subject Name</label>

        <input type="text"
               th:field="*{subjectName}"
               required>

        <button type="submit">
            Update Subject
        </button>

    </form>

    <a class="back"
       th:href="@{/subjects}">
        ← Back to Subjects
    </a>

</div>

</body>

</html>
